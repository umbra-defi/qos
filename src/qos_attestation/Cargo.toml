[package]
name = "umbra_qos_attestation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Attestation, verification and caching for QuorumOS"
repository = "https://github.com/umbra-defi/qos"
readme = "README.md"
keywords = ["quorumos", "nitro", "enclave", "attestation", "aws"]
categories = ["cryptography"]

[lints]
workspace = true

[dependencies]
qos_core = { workspace = true, default-features = false }
qos_crypto = { workspace = true }
qos_nsm = { workspace = true, default-features = false }
qos_hybrid = { workspace = true }
aws-nitro-enclaves-nsm-api = { workspace = true }
thiserror = { workspace = true }
x509-cert = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"], default-features = false, optional = true }

[dev-dependencies]
aws-nitro-enclaves-cose = { workspace = true }
p384 = { workspace = true }
qos_nsm = { workspace = true, features = ["mock"], default-features = false }
serde_bytes = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"], default-features = false }

[features]
# Attestation cache with background refresh
cache = ["dep:tokio"]

[lib]
name = "qos_attestation"
path = "src/lib.rs"
