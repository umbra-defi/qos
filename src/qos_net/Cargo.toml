[package]
name = "umbra_qos_net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Socket to TCP proxy for QuorumOS enclave network access"
repository = "https://github.com/umbra-defi/qos"
readme = "README.md"
keywords = ["quorumos", "enclave", "nitro", "proxy", "vsock"]
categories = ["network-programming"]

[lints]
workspace = true

[dependencies]
qos_core = { workspace = true, default-features = false }

borsh = { workspace = true }
futures = { workspace = true }
hickory-resolver = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
qos_test_primitives = { path = "../qos_test_primitives", package = "umbra_qos_test_primitives" }
httparse = { workspace = true }
chunked_transfer = { workspace = true }
serde_json = { workspace = true, features = [
    "std",
] }
rustls = { workspace = true }
webpki-roots = { workspace = true }

[features]
default = ["proxy"] # keep this as a default feature ensures we lint by default
proxy = ["hickory-resolver", "tokio", "tokio-rustls"]

[lib]
name = "qos_net"
path = "src/lib.rs"

[[bin]]
name = "qos_net"
path = "src/main.rs"
